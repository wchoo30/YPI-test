# Weekly live Drought Monitor forecast for CT planning regions (drought_rf/drought_rf/live.py).
# Runs every Thursday afternoon, after the new Drought Monitor map comes out (8:30 am ET),
# then commits drought_rf/forecasts/ so the log keeps a dated record of every forecast.
# Scheduled runs only start once this file is on the repo's default branch;
# until then, use "Run workflow" on the Actions tab.
name: drought-forecast

on:
  schedule:
    - cron: "0 20 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drought_rf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: drought_rf/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m drought_rf.live all
      - name: Commit the new forecast
        run: |
          git config user.name "drought-forecast bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/
          git diff --cached --quiet || git commit -m "Weekly drought forecast $(date -u +%F)"
          git push
